  zonas:
    activa: true
    antetitulo: Dónde trabajo
    titulo: Zamora y comarcas de alrededor
    texto: "Voy a todos los barrios de Zamora y a los pueblos de alrededor. Si el tuyo no está, pregúntame."
    imagen: /fotos/zonas.jpg
    titulo_pagina: "Pintores en {zona}"
    texto_pagina: "Pintura de interiores, fachadas, comunidades y locales en {zona}, con visita sin compromiso y precio cerrado por escrito."
    items:
      - titulo: Zamora capital
        texto: "Trabajo en todos los barrios de Zamora: pisos del centro y del casco antiguo, viviendas de los barrios nuevos, portales y escaleras de comunidades, locales y oficinas. Al vivir y trabajar aquí, puedo ir a ver tu obra, medir y darte el presupuesto cerrado en poco tiempo.\n\nLos trabajos más habituales en la capital son pintar pisos enteros, quitar gotelé, renovar portales y lacar puertas. En el casco antiguo cuido especialmente el acceso y el ruido, y en los edificios con vecinos acuerdo el horario para molestar lo menos posible. Si tu obra está en un pueblo cercano, como Villaralbo o Morales del Vino, también voy."
      - titulo: Morales del Vino
        texto: "Morales del Vino queda a las puertas de Zamora, en la Tierra del Vino, y allí he pintado tanto casas de pueblo como chalets y fachadas. Es una zona donde se pide mucho renovar la fachada con revestimientos que aguanten el frío del invierno y el sol del verano.\n\nTambién hago interiores: salones, dormitorios, cocinas y escaleras. Al estar tan cerca de la capital, suelo combinar la visita con otros trabajos de la comarca y te lo cuento antes de empezar para que la obra quede cerrada en precio y en fecha. Si vives en Villaralbo o en Coreses, también te atiendo."
      - titulo: Villaralbo
        texto: "Villaralbo está a un paso de Zamora, en el alfoz de la capital, y allí pinto sobre todo viviendas unifamiliares, adosados y pisos de urbanizaciones. Son casas pensadas para vivir, con salones amplios, escaleras y habitaciones que se renuevan cuando cambian los gustos o llegan los niños.\n\nHago el trabajo completo: reparación de paredes, quitar gotelé si lo hay, imprimación y pintura en el color que elijas, con muestras sobre tu propia pared. También pinto fachadas y lacado de puertas y armarios. Como estoy cerca, la visita y el presupuesto cerrado llegan enseguida. Si vives en Morales del Vino o en Coreses, también me desplazo hasta tu casa."
      - titulo: Coreses
        texto: "En Coreses y en la Tierra del Pan trabajo con casas de pueblo, fachadas y locales. Son viviendas con carácter que piden una buena preparación del muro antes de pintar: limpio, reparo grietas y aplico un revestimiento que aguante el frío y la lluvia de la comarca.\n\nPor dentro hago paredes y techos en plástica lisa, empapelado y lacado de puertas. Si tu obra está cerca de Villaralbo o de Toro, aprovecho el viaje para ver varios trabajos el mismo día y no tener que cobrarte desplazamientos de más. Te explico lo que haría, te doy el precio por escrito y, si te encaja, fijamos fecha."
      - titulo: Toro
        texto: "En Toro y su alfoz trabajo con casas antiguas, de gruesos muros de piedra y adobe, que piden una preparación cuidadosa antes de pintar. Reparo con los materiales adecuados, dejo respirar la pared y aplico pinturas que aguantan los cambios de temperatura de la comarca.\n\nAdemás de fachadas y casas de pueblo, pinto pisos y locales, y laco puertas y ventanas de madera. Me desplazo desde Zamora y, si tu obra está en un pueblo cercano como Morales del Vino o Fuentesaúco, la combinamos para que sea más cómodo. Llámame y vamos a ver lo que necesitas."
      - titulo: Fuentesaúco
        texto: "En Fuentesaúco y en la comarca de la Guareña pinto casas de pueblo, fachadas, locales y naves. Es una zona de casas amplias donde el trabajo suele ser de exterior, y por eso cuento con el tiempo y con la época del año para que la pintura se seque bien y dure.\n\nTambién trabajo en interiores, con paredes y techos en plástica lisa, quitando gotelé si hace falta. Si tu obra está cerca de Toro o de Coreses, puedo aprovechar el viaje y hacerte la visita en el mismo día. Pide presupuesto sin compromiso y te digo el precio por escrito."
      - titulo: Bermillo de Sayago
        texto: "Bermillo de Sayago es la puerta de la comarca de Sayago, una zona de casas de piedra y pueblos pequeños en la que se agradece que el pintor vaya hasta allí. Pinto fachadas y puertas de madera, interiores de casas de pueblo y también locales y bares del municipio.\n\nEn las casas de piedra y de adobe cuido que el material respire: reparo con morteros adecuados y elijo pinturas transpirables para que no salga humedad. Si tienes una casa de fin de semana que quieres dejar lista para el verano, lo organizamos con tiempo y te la entrego limpia. Pregunta por tu pueblo si no lo ves en la lista, que seguramente también llego."
      - titulo: Benavente
        texto: "Benavente es la capital de Los Valles y allí tengo clientes de casas, locales y comunidades de vecinos. He pintado desde puertas lacadas en blanco hasta pisos completos, siempre con visita previa, presupuesto por escrito y fecha de entrega pactada.\n\nSi tu vivienda es un piso en un edificio, preparo bien los accesos y cuido a los vecinos; si es una casa con patio o un local comercial, me adapto a tus horarios, incluidas las tardes y los fines de semana, para que no tengas que cerrar el negocio. También atiendo los pueblos de Los Valles que quedan cerca de Benavente. Cuéntame qué quieres pintar y vamos a verlo."
      - titulo: Alcañices
        texto: "Alcañices es el centro de la comarca de Aliste, en el oeste de la provincia. Me desplazo hasta allí para pintar casas, fachadas, locales y alguna nave, y cuando hay varios vecinos del entorno interesados agrupo las visitas para ahorrar viajes.\n\nEs un territorio de inviernos fríos, así que en las fachadas elijo revestimientos que aguanten los cambios de temperatura y las heladas, y planifico la obra para la mejor época del año. Dentro de casa hago paredes lisas, techos, lacado de puertas y papel pintado. Llámame, cuéntame qué quieres pintar y vamos a verlo sin compromiso; te digo el precio cerrado por escrito antes de empezar."

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que dicen en casa
    testimonios:
      - { texto: "Quitó el gotelé de todo el piso en una semana. Tapó cada mueble y al acabar no había ni una mota de polvo.", autor: Pilar G., servicio: "Piso completo · San José Obrero" }
      - { texto: "El presupuesto fue el que nos dijo, ni un euro más, y acabó el día que prometió. La fachada ha quedado preciosa.", autor: Javier y Rosa, servicio: "Fachada · Morales del Vino" }
      - { texto: "Pintó la escalera de nuestra comunidad sin molestar a nadie. Todos los vecinos contentos, que ya es decir.", autor: Comunidad Avenida de Galicia, servicio: "Portal y escalera · Zamora" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que me preguntan antes de empezar
    texto: "Si tienes otra duda, escríbeme por WhatsApp y te contesto enseguida."
    preguntas:
      - { pregunta: "¿El presupuesto es gratis?", respuesta: "Sí. Voy a ver la obra sin coste y te mando el precio cerrado por escrito en uno o dos días." }
      - { pregunta: "¿Tengo que vaciar las habitaciones?", respuesta: "No hace falta. Junto los muebles en el centro, los tapo con plástico y protejo el suelo. Solo te pido que guardes los objetos pequeños." }
      - { pregunta: "¿Cuánto se tarda en pintar un piso?", respuesta: "Un piso de tres habitaciones sin gotelé, unos tres o cuatro días. Si hay que quitar gotelé, cuenta con una semana." }
      - { pregunta: "¿Huele mucho la pintura?", respuesta: "Uso pinturas al agua de bajo olor. Puedes dormir en casa la misma noche con la ventana un poco abierta." }
      - { pregunta: "¿Pones tú la pintura?", respuesta: "Sí, el material va incluido en el presupuesto. Si ya tienes la pintura o quieres una marca concreta, también me adapto." }

