  servicios:
    activa: true
    antetitulo: Servicios
    titulo: Lo que pinto
    texto: "Del dormitorio de los niños a la fachada de la comunidad. Los precios son orientativos: el tuyo, cerrado, después de ver la obra."
    items:
      - titulo: Pisos y casas
        texto: "Paredes y techos en plástica lisa, con reparación de grietas y desconchones antes de pintar."
        icono: rodillo
        precio: "desde 6 €/m²"
        detalle: |
          Pintar un piso o una casa empieza mucho antes de abrir el primer bote. Reviso paredes y techos, tapo grietas y desconchones, lijo lo que haga falta y doy una mano de imprimación donde la pared lo pide, para que la pintura agarre igual en toda la superficie y no queden manchas al secarse.

          El acabado habitual es plástica lisa en paredes y techos, en el color que elijas. Si dudas entre tonos, te acerco muestras y las probamos sobre la propia pared con la luz de tu casa, que es la que cuenta. Trabajo habitación a habitación para que puedas seguir usando el resto de la vivienda.

          Protejo suelos, muebles, enchufes y marcos antes de empezar y lo dejo todo recogido y limpio al terminar. Es un servicio pensado para quien estrena casa, para quien quiere renovar la suya o para quien tiene un piso de alquiler y necesita dejarlo listo para el siguiente inquilino.
      - titulo: Quitar gotelé
        texto: "Rasco o tapo el gotelé, aliso con pasta y dejo las paredes listas para pintar en liso."
        icono: pared
        precio: "desde 11 €/m²"
        detalle: |
          El gotelé es la textura rugosa que muchas casas tienen en paredes y techos desde hace décadas. Quitarlo deja las paredes lisas y actuales y hace que cualquier color se vea mejor. Es un trabajo que lleva su tiempo y su método, y por eso conviene hacerlo bien desde el principio.

          Según el estado de la pared, humedezco y rasco el gotelé, o bien lo tapo con pasta fina. Después aliso con varias pasadas, lijo hasta que no se note ni un relieve y reparo cualquier golpe o fisura que haya quedado a la vista. Solo entonces imprimo y pinto en liso.

          Es un trabajo que levanta polvo y humedad, así que cubro muy bien suelos, muebles y puertas con plástico y cinta, y cierro las estancias en las que trabajo. Al acabar limpio a fondo. Es una buena opción para quien va a estrenar casa o para quien lleva años queriendo olvidarse de la pared rugosa del salón.
      - titulo: Fachadas
        texto: "Limpieza, reparación y pintura con revestimiento elástico que aguanta el frío y la lluvia."
        icono: casa
        precio: "desde 14 €/m²"
        detalle: |
          La fachada es la primera cara de la casa y la que más castiga el tiempo: el sol, el hielo del invierno y la lluvia van deshaciendo la pintura y abriendo pequeñas grietas por las que entra el agua. Pintarla a tiempo protege el muro y evita arreglos mucho mayores.

          El trabajo empieza limpiando la superficie y quitando la pintura suelta y los restos de humedad. Después reparo grietas y desconchones con mortero y selladores adecuados, aplico una imprimación y termino con un revestimiento elástico que sigue los movimientos del muro sin agrietarse y deja pasar el vapor de agua.

          Antes de empezar te propongo colores que combinen con el entorno y con las normas del pueblo o de la comunidad, si las hay. Trabajo con el material de seguridad necesario cuando hay que subir, y planifico la obra según el tiempo, porque con lluvia no se debe pintar una fachada.
      - titulo: Comunidades de vecinos
        texto: "Portales, escaleras y garajes con horario pactado para molestar lo mínimo."
        icono: edificio
        precio: "Consultar"
        detalle: |
          Pintar los espacios comunes de un edificio es un trabajo en el que cuenta tanto la pintura como la manera de trabajar. Hay vecinos que entran y salen cada día, niños, personas mayores y carritos, y la obra tiene que molestar lo mínimo y no dejar nada peligroso a su paso.

          Pinto portales, escaleras, descansillos y garajes, con zócalos lavables en las zonas que más se ensucian y pinturas resistentes al roce. Pacto con la administración o con el presidente un horario y un orden de trabajo, aviso a los vecinos con un cartel y dejo las zonas de paso despejadas y señalizadas.

          Presento un presupuesto por escrito que se puede llevar a la junta, con los trabajos, los materiales y los plazos detallados, para que la decisión se tome con toda la información. Al terminar repaso cada tramo con quien me lo pida y dejo la escalera limpia.
      - { titulo: Papel pintado, texto: "Quito el papel viejo, preparo la pared y coloco papel pintado o vinílico.", icono: empapelado, precio: "desde 9 €/m²" }
      - titulo: Lacado de puertas y muebles
        texto: "Puertas, armarios y radiadores lacados en blanco o en color, con pistola y sin goteras."
        icono: pistola
        precio: "desde 70 €/puerta"
        detalle: |
          Lacar es la forma de renovar puertas, armarios, cocinas o radiadores sin tener que cambiarlos. Con una buena preparación, un lacado con pistola deja un acabado fino y uniforme, sin marcas de brocha ni goteras, y con una dureza que aguanta el uso diario.

          El proceso incluye desmontar herrajes y tiradores, limpiar y lijar la superficie, tapar poros y golpes, imprimar y aplicar varias manos finas de laca, con el secado entre ellas. Según el caso se trabaja en la propia casa, cubriendo todo lo que no se lacea, o se desmontan las piezas para lacarlas con más comodidad.

          Se puede elegir blanco o cualquier color, en acabado mate, satinado o brillante. Es muy habitual lacar en blanco puertas de madera oscura para dar luz a un pasillo, o renovar los armarios de una cocina antigua para darle un aire distinto sin hacer obra.
      - { titulo: Locales y oficinas, texto: "Trabajo por las tardes o en fin de semana para que no tengas que cerrar.", icono: brocha, precio: "Consultar" }
      - { titulo: Naves y pintura industrial, texto: "Suelos de resina, estructuras metálicas y señalización de naves y talleres.", icono: nave, precio: "Consultar" }

